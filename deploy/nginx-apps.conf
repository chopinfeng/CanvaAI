# 挂在已有站点的 /apps/ 下面。把这个 location 块并进你站点的 server 段里。
#
# 注意三件事，少一件就有一类症状：
#
# 1. 不要在 proxy_pass 后面写路径（不要写成 http://127.0.0.1:3001/）。
#    写了 nginx 会自己剥掉 /apps 前缀，而应用是靠 BASE_PATH=/apps 自己剥的，
#    剥两次的结果是全站 404。让 nginx 原样转发，前缀只由应用处理。
#
# 2. WebSocket 那三行 header 必须有。少了的话页面能打开、画布是空的、
#    右上角一直显示"连接中"——看起来像后端挂了，其实是握手被降级成普通 HTTP。
#
# 3. proxy_read_timeout 要调大。辅导时一个回合会阻塞在 interact_ask_user 上
#    等学生思考，默认 60 秒会被 nginx 掐断，表现成"老师问完就没声了"。

location /apps/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 学生想多久是他的事，别让代理替他做决定
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # 上传扫描件用
    client_max_body_size 20m;

    # 这个应用自己没有登录。公网放出去之前，至少加一道口令——
    # 否则任何人都能驱动 Agent，烧的是你的 DeepSeek 额度。
    # auth_basic "CanvaAI";
    # auth_basic_user_file /etc/nginx/.htpasswd;
}
